<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Coach · Essor Athletics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,900&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Same look as the rest of the site: near-black, off-white, vert sapin and mint. */
:root {
  --bg: #0A0A0A; --fg: #FAFAF8; --card: #161616; --line: #262626; --muted: #9AA7A1;
  --accent: #1E4D3A; --accent-soft: rgba(124,196,162,0.12); --mint: #7CC4A2; --bad: #E07A5F; --warn: #E9C46A;
  --display: 'Archivo', 'Arial Black', Arial, sans-serif; --body: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important }
button { font: inherit; color: inherit; }
.hero { position: relative; overflow: hidden; background: linear-gradient(160deg, #12291f 0%, #0A0A0A 70%); }
.hero .in { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 22px 16px 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.lanes { position: absolute; right: -8%; top: -60%; width: 46%; max-width: 300px; opacity: 0.4; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand a { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 38px; letter-spacing: -1.2px; line-height: 0.95; color: #fff; text-decoration: none; }
.brand span { font-size: 13px; color: var(--mint); letter-spacing: 3px; }
.kicker { font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 0; }
.hero .kicker { color: var(--mint); margin-bottom: 6px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 72px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 32px; line-height: 1.02; letter-spacing: -0.8px; margin: 0; }
h2 { font-size: 13px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 8px 0 0; display: flex; justify-content: space-between; align-items: baseline; }
h2 b { color: var(--fg); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 14px; }
p { margin: 0 }
.muted { color: var(--muted); } .small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
input[type=text], input[type=password], input[type=search] { width: 100%; font: inherit; font-size: 17px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.btn { font-size: 17px; font-weight: 500; border: 0; border-radius: 26px; height: 50px; padding: 0 20px; background: var(--mint); color: #0A0A0A; cursor: pointer; width: 100%; }
.btn.line { background: transparent; color: var(--fg); border: 1px solid var(--line); font-size: 15px; height: 42px; }
.btn.sm { width: auto; height: 36px; font-size: 14px; padding: 0 14px; }
.hint-bad { color: var(--bad); font-size: 14px; }

/* The session */
.sess { background: var(--accent); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.sess .kicker { color: rgba(255,255,255,0.75); }
.sess .title { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 40px; line-height: 0.98; letter-spacing: -1px; }
.sess p { color: rgba(255,255,255,0.9); font-size: 15px; }
.lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: rgba(0,0,0,0.25); border-radius: 14px; padding: 4px; margin-top: 4px; }
.lv button { border: 0; border-radius: 10px; padding: 9px 4px; background: transparent; color: rgba(255,255,255,0.7); font-size: 15px; cursor: pointer; }
.lv button[aria-pressed="true"] { background: var(--mint); color: #0A0A0A; font-weight: 600; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.facts div { background: rgba(0,0,0,0.22); border-radius: 12px; padding: 8px 10px; }
.facts span { display: block; font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: rgba(255,255,255,0.65); }
.facts b { font-size: 16px; font-variant-numeric: tabular-nums; }
.flow { display: flex; flex-direction: column; gap: 6px; }
.step { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 8px 12px; border: 1px dashed rgba(255,255,255,0.25); border-radius: 12px; font-size: 14px; }
.step b { font-weight: 600; white-space: nowrap; } .step span { text-align: right; color: rgba(255,255,255,0.85); }
.blk { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.bh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.bh b { color: var(--mint); font-weight: 600; } .bh span { font-size: 13px; color: rgba(255,255,255,0.75); }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pills i { font-style: normal; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--mint); color: #0A0A0A; border-radius: 999px; padding: 4px 10px; }
.gap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.8); padding: 0 4px; }
.gap::before, .gap::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.25); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.stat span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; }
.stat b { font-family: var(--display); font-style: italic; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.warn b { color: var(--warn); }
.note { border: 1px dashed var(--line); border-radius: 14px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.note b { color: var(--fg); font-weight: 600; }

/* Tabs, filters */
.seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; position: sticky; top: 8px; z-index: 5; }
.seg button { font-size: 15px; border: 0; border-radius: 10px; padding: 10px 6px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 0 0 1px var(--mint); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--mint); color: var(--fg); background: var(--accent-soft); }

/* Pace groups */
.group { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.group > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.group > header .g { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 22px; letter-spacing: -0.4px; }
.group > header .t { text-align: right; font-variant-numeric: tabular-nums; }
.group > header .t b { display: block; color: var(--mint); font-size: 22px; font-weight: 600; line-height: 1.1; }
.group > header .t span { font-size: 12px; color: var(--muted); }

/* Athlete rows */
.list { display: flex; flex-direction: column; }
.card.flush { padding: 0; overflow: hidden; gap: 0; }
.ath { border-top: 1px solid var(--line); }
.ath:first-child { border-top: 0; }
.ath > button { width: 100%; background: transparent; border: 0; text-align: left; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 13px; color: transparent; }
.dot.on { background: var(--mint); border-color: var(--mint); color: #0A0A0A; font-weight: 700; }
.dot.na { border-style: dashed; }
.who b { font-weight: 600; font-size: 16px; }
.who .sub { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 3px; font-size: 12.5px; color: var(--muted); }
.tag { font-size: 11.5px; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.l1 { color: #0A0A0A; background: var(--mint); border-color: var(--mint); }
.tag.l2 { color: var(--mint); border-color: var(--mint); }
.tag.l3 { color: var(--fg); border-color: #4a4a4a; }
.tag.inj { color: var(--bad); border-color: var(--bad); }
.tag.warn { color: var(--warn); border-color: var(--warn); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.num b { display: block; font-size: 18px; font-weight: 600; color: var(--mint); line-height: 1.15; }
.num b.none { color: var(--warn); font-size: 14px; }
.num span { font-size: 12px; color: var(--muted); }
.more { padding: 2px 16px 14px 48px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cell { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.cell span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
.cell b { font-variant-numeric: tabular-nums; font-size: 15px; }
.inj-box { border: 1px solid var(--bad); color: #f3c4b6; border-radius: 12px; padding: 8px 10px; }
.empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }
.foot { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } .sess .title { font-size: 34px; } .grid { grid-template-columns: repeat(2, 1fr); } }
@media print { .seg, .chips, .foot, #search, .hero .lanes { display: none !important } body { background: #fff; color: #000 } }
</style>
</head>
<body>
<header class="hero">
  <svg class="lanes" viewBox="0 0 400 620" aria-hidden="true">
    <rect x="1" y="1" width="398" height="618" rx="199" fill="none" stroke="#7CC4A2" stroke-width="1.2" opacity="0.6"/>

<main class="wrap">

    <div class="card">

    </div>
  </section>

  <p class="muted" id="loading">Chargement…</p>

  <!-- 2. The hub -->
  <section id="hub" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="sess" id="sess"></div>
    <div class="stats" id="stats"></div>

        <button class="btn line sm" id="refresh">Actualiser</button>
        <button class="btn line sm" id="out">Sortir</button>
      </span>
    </div>
  </section>
</main>

<script>
/* ── Supabase (same project as the rest of the site). Everything here goes through
      coach_athletes() (supabase/coach.sql) and coach_wodify() (supabase/wodify.sql):
      wrong code → nothing comes back. ── */
const SUPABASE_URL = "https://rqomypmgbjigukvztjxz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LnDYfyrKMTOunfAH29ZFTQ_CY3GtJE5";
const rpc = async (fn, args) => {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args),
  });
  if (!r.ok) { const e = new Error(fn + " " + r.status); e.status = r.status; throw e; }
  return r.json();
};

/* ── Cycle sessions — generated from js/lib/sessions.js by scripts/build_site_sessions.js. Don't edit by hand. ── */
/* SESSIONS:START */
const SESSIONS = [{"id":"2026-10-30-test-vma","date":"2026-10-30","title":"Test VMA","kind":"test","summary":"6 minutes à fond : la distance parcourue donne ta VMA, et toutes tes allures en découlent.","warmup":[{"easy":"15:00"},{"drills":"Montées de genoux, talons-fesses, pas chassés, foulées bondissantes"},{"repeat":3,"steps":[{"run":80,"vma":90,"note":"Accélération progressive"},{"walk":"0:45","note":"Retour en marchant"}]}],"cooldown":[{"easy":"10:00","note":"Très facile, puis étirements"}],"levels":{"level1":[{"test":"6:00"}],"level2":[{"test":"6:00"}],"level3":[{"test":"6:00"}]}},{"id":"2026-11-06-vo2-10k","date":"2026-11-06","title":"VO2 Max","kind":"vo2","summary":"Des répétitions à ton allure 10 km, 2' de récup en marchant. Toutes à la même vitesse : si la dernière est la plus lente, tu es parti·e trop vite.","warmup":[{"easy":"15:00"},{"drills":"Skipping, talons-fesses, montées de genoux"}],"cooldown":[{"easy":"10:00","note":"Très facile, puis étirements"}],"levels":{"level1":[{"repeat":5,"steps":[{"run":1000,"vma":90}],"rest":{"walk":"2:00"}}],"level2":[{"repeat":4,"steps":[{"run":1000,"vma":90}],"rest":{"walk":"2:00"}}],"level3":[{"repeat":3,"steps":[{"run":800,"vma":90}],"rest":{"walk":"2:00"}}]}},{"id":"2026-11-13-30-30","date":"2026-11-13","title":"VMA 30/30","kind":"vo2","summary":"30 secondes vite, 30 secondes trottinées. On cherche la régularité : la dernière comme la première.","warmup":[{"easy":"15:00"}],"cooldown":[{"easy":"10:00"}],"levels":{"level1":[{"repeat":2,"steps":[{"repeat":8,"steps":[{"run":"0:30","vma":100},{"jog":"0:30"}]}],"rest":{"jog":"3:00"}}],"level2":[{"repeat":2,"steps":[{"repeat":6,"steps":[{"run":"0:30","vma":100},{"jog":"0:30"}]}],"rest":{"jog":"3:00"}}],"level3":[{"repeat":2,"steps":[{"repeat":4,"steps":[{"run":"0:30","vma":100},{"jog":"0:30"}]}],"rest":{"jog":"3:00"}}]}},{"id":"2026-11-20-vo2-10k","date":"2026-11-20","title":"VO2 Max 400 m","kind":"vo2","summary":"Des 400 m en deux blocs, un peu plus vite que ton allure 10 km. 1' de récup en marchant entre les 400, 3' entre les deux blocs. Régulier du premier au dernier.","warmup":[{"easy":"15:00"},{"drills":"Skipping, talons-fesses, montées de genoux"}],"cooldown":[{"easy":"10:00","note":"Très facile, puis étirements"}],"levels":{"level1":[{"repeat":2,"steps":[{"repeat":6,"steps":[{"run":400,"vma":95}],"rest":{"walk":"1:00"}}],"rest":{"walk":"3:00"}}],"level2":[{"repeat":2,"steps":[{"repeat":5,"steps":[{"run":400,"vma":95}],"rest":{"walk":"1:00"}}],"rest":{"walk":"3:00"}}],"level3":[{"repeat":2,"steps":[{"repeat":3,"steps":[{"run":400,"vma":95}],"rest":{"walk":"1:00"}}],"rest":{"walk":"3:00"}}]}},{"id":"2026-11-27-pyramide","date":"2026-11-27","title":"Pyramide","kind":"pyramid","summary":"La pyramide de Mel : 400 / 300 / 200, puis on remonte 200 / 300 / 400. Les 200 et 300 à ta VMA, les 400 juste en dessous. 1' de récup en marchant entre chaque, 3' entre les blocs.","warmup":[{"easy":"15:00"},{"drills":"Skipping, talons-fesses, montées de genoux"}],"cooldown":[{"easy":"10:00","note":"Très facile, puis étirements"}],"levels":{"level1":[{"repeat":2,"steps":[{"run":400,"vma":95},{"walk":"1:00"},{"run":300,"vma":100},{"walk":"1:00"},{"run":200,"vma":100},{"walk":"1:00"},{"run":200,"vma":100},{"walk":"1:00"},{"run":300,"vma":100},{"walk":"1:00"},{"run":400,"vma":95}],"rest":{"walk":"3:00"}}],"level2":[{"repeat":2,"steps":[{"run":400,"vma":95},{"walk":"1:00"},{"run":300,"vma":100},{"walk":"1:00"},{"run":200,"vma":100},{"walk":"1:00"},{"run":200,"vma":100},{"walk":"1:00"},{"run":300,"vma":100},{"walk":"1:00"},{"run":400,"vma":95}],"rest":{"walk":"3:00"}}],"level3":[{"run":400,"vma":95},{"walk":"1:00"},{"run":300,"vma":100},{"walk":"1:00"},{"run":200,"vma":100},{"walk":"1:00"},{"run":200,"vma":100},{"walk":"1:00"},{"run":300,"vma":100},{"walk":"1:00"},{"run":400,"vma":95},{"walk":"3:00"},{"run":400,"vma":95},{"walk":"1:00"},{"run":300,"vma":100},{"walk":"1:00"},{"run":200,"vma":100}]}},{"id":"2026-12-04-30-30","date":"2026-12-04","title":"VMA 30/30","kind":"vo2","summary":"Le 30/30 du 13/11, avec un peu plus de répétitions. Toujours la même régularité : la dernière comme la première.","warmup":[{"easy":"15:00"}],"cooldown":[{"easy":"10:00"}],"levels":{"level1":[{"repeat":2,"steps":[{"repeat":10,"steps":[{"run":"0:30","vma":100},{"jog":"0:30"}]}],"rest":{"jog":"3:00"}}],"level2":[{"repeat":2,"steps":[{"repeat":7,"steps":[{"run":"0:30","vma":100},{"jog":"0:30"}]}],"rest":{"jog":"3:00"}}],"level3":[{"repeat":2,"steps":[{"repeat":5,"steps":[{"run":"0:30","vma":100},{"jog":"0:30"}]}],"rest":{"jog":"3:00"}}]}},{"id":"2026-12-11-vo2-10k","date":"2026-12-11","title":"VO2 Max · allure course","kind":"vo2","summary":"Des répétitions à ton allure 10 km, 2' de récup en marchant. Toutes à la même vitesse : si la dernière est la plus lente, tu es parti·e trop vite.","warmup":[{"easy":"15:00"},{"drills":"Skipping, talons-fesses, montées de genoux"}],"cooldown":[{"easy":"10:00","note":"Très facile, puis étirements"}],"levels":{"level1":[{"repeat":5,"steps":[{"run":1000,"vma":90}],"rest":{"walk":"2:00"}}],"level2":[{"repeat":4,"steps":[{"run":1000,"vma":90}],"rest":{"walk":"2:00"}}],"level3":[{"repeat":3,"steps":[{"run":800,"vma":90}],"rest":{"walk":"2:00"}}]}},{"id":"2026-12-18-legere","date":"2026-12-18","title":"Séance légère","kind":"easy","summary":"Deux jours avant la course : juste de quoi réveiller les jambes. On garde de la fraîcheur pour dimanche.","warmup":[{"easy":"15:00"}],"cooldown":[{"easy":"10:00","note":"Très facile"}],"levels":{"level1":[{"repeat":3,"steps":[{"run":"1:00","vma":90,"note":"Allure course 10 km"},{"jog":"1:00"}]}],"level2":[{"repeat":3,"steps":[{"run":"1:00","vma":90,"note":"Allure course 10 km"},{"jog":"1:00"}]}],"level3":[{"repeat":3,"steps":[{"run":"1:00","vma":90,"note":"Allure course 10 km"},{"jog":"1:00"}]}]}}];
/* SESSIONS:END */

/* ── Running maths — same numbers as the app (js/lib/paces.js) ── */
const clock = (sec) => { const s = Math.round(sec); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const paceAt = (vma, pct) => 3600 / (vma * pct / 100);            // s per km
const repTime = (m, vma, pct) => (m / 1000) * paceAt(vma, pct);  // s
const repDist = (sec, vma, pct) => Math.round((vma * pct / 100) * 1000 * sec / 3600 / 10) * 10; // m, to 10 m
const toSec = (v) => typeof v === "number" ? v : String(v).split(":").reduce((t, n) => t * 60 + Number(n), 0);
const dur = (v) => { const s = toSec(v), m = Math.floor(s / 60), r = s % 60; return !m ? `${r}"` : r ? `${m}'${String(r).padStart(2, "0")}` : `${m}'`; };

/* ── Levels ── */
const LEVELS = [
  { id: "level1", name: "Level 1", short: "L1", cls: "l1", club: true },
  { id: "level2", name: "Level 2", short: "L2", cls: "l2", club: true },
  { id: "level3", name: "Level 3", short: "L3", cls: "l3", club: true },
  { id: "beginnerC", name: "Débuter C", short: "Déb. C", cls: "" },
  { id: "beginnerB", name: "Débuter B", short: "Déb. B", cls: "" },
  { id: "beginnerA", name: "Débuter A", short: "Déb. A", cls: "" },
];
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\([^)]*\)/g, " ").replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
const levelKey = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
const levelOf = (raw) => { const k = levelKey(raw); return (k && LEVELS.find(l => levelKey(l.id) === k || levelKey(l.name) === k)) || null; };

/* ── A session in words ── */
const describe = (st) => {
  if (st.repeat) {
    const inner = st.steps.map(describe).join(" + ");
    const simple = st.steps.length === 1 && !st.steps[0].repeat;
    return `${st.repeat} × ${simple ? inner : "(" + inner + ")"}${st.rest ? ` · récup ${describe(st.rest)}` : ""}`;
  }
  if (st.run != null) return typeof st.run === "number" ? `${st.run} m` : dur(st.run);
  if (st.jog) return `${dur(st.jog)} trot`;
  if (st.walk) return `${dur(st.walk)} marche`;
  if (st.easy) return `${dur(st.easy)} footing`;
  if (st.test) return `test ${dur(st.test)}`;
  return st.drills ? "éducatifs" : "";
};
/* The distinct fast reps of a set: [{ run, vma }] */
const reps = (steps, out = []) => {
  (steps || []).forEach(st => {
    if (st.repeat) reps(st.steps, out);
    else if (st.run != null && st.vma && !out.some(o => o.run === st.run && o.vma === st.vma)) out.push({ run: st.run, vma: st.vma });
  });
  return out;
};
const mainOf = (session, levelId) => { const l = session && session.levels[levelId]; return Array.isArray(l) ? l : (l && l.main) || []; };
const target = (rep, vma) => typeof rep.run === "number" ? clock(repTime(rep.run, vma, rep.vma)) : `${repDist(toSec(rep.run), vma, rep.vma)} m`;
const repLabel = (rep) => typeof rep.run === "number" ? `${rep.run} m` : dur(rep.run);

const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const nextSession = () => { const t = todayIso(), h = new Date().getHours(); return SESSIONS.find(x => x.date > t || (x.date === t && h < 19)) || null; };
const heldSessions = () => { const t = todayIso(), h = new Date().getHours(); return SESSIONS.filter(x => x.date < t || (x.date === t && h >= 19)).length; };
const frDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ── State ── */
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const $ = (id) => document.getElementById(id);
let code = store.get("essor-coach-code") || "";
let athletes = [], wod = null, extras = [], session = null, view = "groups", levelFilter = "", open = new Set();

/* ── Data ── */
const pickVma = (row) => {
  const site = row.vma && Number(row.vma.vma);
  const p = row.progress && row.progress.vma;
  const phone = Number(typeof p === "object" && p ? (p.vma ?? p.value) : p);
  return site || phone || null;
};
const toAthlete = (row) => {
  const a = row.answers || {}, p = row.progress || {};
  return {
    id: row.id, name: row.name || "", key: norm(row.name), level: levelOf(p.level || row.level) , siteLevel: levelOf(row.level),
    vma: pickVma(row), testM: row.vma && row.vma.test_m, hr: row.vma && row.vma.hr_max, vmaAt: row.vma && row.vma.updated_at,
    history: (row.vma && row.vma.history) || [],
    appDone: p.at ? Object.keys(p.done || {}).length : null,
    injury: a.injury === "yes", injuryDetail: a.injuryDetail || "", goal: a.goal || "", bests: a.bests || {}, fiveK: a.fiveK || "",
    booked: null, done: null,
  };
};
/* Wodify names don't always match the questionnaire's: exact first, then first + last word */
const matchName = (name) => {
  const k = norm(name); if (!k) return null;
  const parts = k.split(" ");
  return athletes.find(a => a.key === k)
    || athletes.find(a => { const p = a.key.split(" "); return p[0] === parts[0] && p[p.length - 1] === parts[parts.length - 1]; })
    || athletes.find(a => { const p = a.key.split(" "); return parts.length > 1 && p.includes(parts[0]) && p.includes(parts[parts.length - 1]); })
    || null;
};
const applyWodify = () => {
  extras = [];
  const forNext = wod && session && wod.session_date === session.date;
  athletes.forEach(a => { a.booked = forNext ? false : null; a.done = null; });
  if (!wod) return;
  if (forNext) (wod.booked || []).forEach(n => { const a = matchName(n); a ? (a.booked = true) : extras.push(n); });
  Object.entries(wod.attended || {}).forEach(([n, c]) => { const a = matchName(n); if (a) a.done = (a.done || 0) + Number(c || 0); });
  if (wod.attended) athletes.forEach(a => { if (a.done == null) a.done = 0; });
};
const load = async () => {
  $("loading").hidden = false; $("gate").hidden = true;
  let rows;
  try { rows = await rpc("coach_athletes", { p_code: code }); }
  catch (e) {
    $("loading").hidden = true; $("hub").hidden = true; $("gate").hidden = false;
    if (code) { $("gateBad").textContent = e.status === 401 || e.status === 403 ? "Ce code n'est pas le bon." : "Connexion impossible — réessaie."; $("gateBad").hidden = false; }
    store.set("essor-coach-code", null); code = ""; return;
  }
  store.set("essor-coach-code", code);
  athletes = (rows || []).map(toAthlete);
  try { const w = await rpc("coach_wodify", { p_code: code }); wod = w && w.data ? { ...w.data, updated_at: w.updated_at } : null; }
  catch { wod = null; }
  session = nextSession();
  applyWodify();
  $("loading").hidden = true; $("hub").hidden = false;
  render();
};

/* ── Rendering ── */
const sessionsDone = (a) => a.done != null ? a.done : a.appDone;
const cmp = (a, b) => (b.vma || 0) - (a.vma || 0) || a.name.localeCompare(b.name);
const pool = () => (wod && session && wod.session_date === session.date) ? athletes.filter(a => a.booked) : athletes.filter(a => a.level && a.level.club);

const row = (a) => {
  const main = a.level && a.level.club ? reps(mainOf(session, a.level.id)) : [];
  const first = main[0];
  const done = sessionsDone(a), held = heldSessions();
  const isOpen = open.has(a.id);
  const tags = [
    a.level ? `<span class="tag ${a.level.cls}">${a.level.name}</span>` : `<span class="tag warn">Niveau ?</span>`,
    a.injury ? `<span class="tag inj">Douleur</span>` : "",
    done != null ? `<span>${done}${held ? " / " + held : ""} séance${done > 1 ? "s" : ""}</span>` : "",
  ].join("");
  const right = a.vma
    ? (first ? `<b>${target(first, a.vma)}</b><span>${repLabel(first)} · VMA ${a.vma.toFixed(1)}</span>` : `<b>${a.vma.toFixed(1)}</b><span>VMA km/h</span>`)
    : a.level && !a.level.club ? `<b class="none" style="color:var(--muted)">—</b><span>marche-course</span>` : `<b class="none">Pas de VMA</b><span>à tester</span>`;
  let more = "";
  if (isOpen) {
    const cells = [];
    if (a.vma) {
      main.forEach(r => cells.push([`${repLabel(r)} · ${r.vma} %`, target(r, a.vma)]));
      cells.push(["Allure VMA", clock(paceAt(a.vma, 100)) + " /km"], ["Allure 10 km", clock(paceAt(a.vma, 90)) + " /km"], ["Footing", `${clock(paceAt(a.vma, 68))}–${clock(paceAt(a.vma, 63))}`]);
      if (a.testM) cells.push(["Test 6'", a.testM + " m"]);
    }
    if (a.hr) cells.push(["FC max", a.hr + " bpm"]);
    if (a.fiveK) cells.push(["5 km déclaré", ({ never: "Jamais", "30plus": "+ de 30'", "25-30": "25–30'", sub25: "- de 25'" })[a.fiveK] || a.fiveK]);
    const set = a.level && a.level.club && session ? mainOf(session, a.level.id).map(describe).join(" + ") : "";
    more = `<div class="more">
      ${set ? `<p><span class="muted">Sa séance :</span> ${esc(set)}</p>` : a.level && !a.level.club ? `<p class="muted">Programme ${a.level.name} — marche-course, pas de séance club.</p>` : ""}
      ${a.injury ? `<div class="inj-box">${esc(a.injuryDetail || "Douleur signalée au questionnaire")}</div>` : ""}
      ${cells.length ? `<div class="grid">${cells.map(([k, v]) => `<div class="cell"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>` : ""}
      ${a.history.length > 1 ? `<p class="muted small">VMA : ${a.history.map(h => Number(h.vma).toFixed(1)).join(" → ")}</p>` : ""}
      ${a.siteLevel && a.level && a.siteLevel.id !== a.level.id ? `<p class="muted small">Questionnaire : ${a.siteLevel.name}</p>` : ""}
    </div>`;
  }
  const dot = a.booked == null ? `<span class="dot na" title="Réservation inconnue"></span>` : `<span class="dot ${a.booked ? "on" : ""}" title="${a.booked ? "Réservé" : "Pas réservé"}">✓</span>`;
  return `<div class="ath"><button type="button" data-id="${esc(a.id)}" aria-expanded="${isOpen}">${dot}<span class="who"><b>${esc(a.name)}</b><span class="sub">${tags}</span></span><span class="num">${right}</span></button>${more}</div>`;
};

/* Packs of runners who can run the reps together: sorted by VMA, a new pack when the gap to the pack's fastest passes 0.8 km/h */
const packs = (list) => {
  const out = [];
  list.filter(a => a.vma && a.level && a.level.club).sort(cmp).forEach(a => {
    const g = out[out.length - 1];
    if (g && g[0].vma - a.vma <= 0.8) g.push(a); else out.push([a]);
  });
  return out;
};
const packTarget = (g) => {
  const rep = reps(mainOf(session, g[0].level.id))[0] || reps(mainOf(session, "level2"))[0];
  if (!rep) return null;
  const fast = target(rep, g[0].vma), slow = target(rep, g[g.length - 1].vma);
  return { label: repLabel(rep), text: fast === slow ? fast : `${fast} – ${slow}` };
};

/* The main set as blocks of reps: [{ pills: ["400 m", …], rec } | { rest }] */
const runsOf = (steps) => steps.filter(x => x.run != null);
const recOf = (st) => { const r = st.rest || st.steps.find(x => x.jog || x.walk); return r ? describe(r) : ""; };
const blocksOf = (main) => {
  const out = [];
  // loose steps (run / walk / run / long walk / run…): the shortest recovery is "between reps", a longer one splits the blocks
  const pause = (x) => toSec(x.walk || x.jog || 0);
  const short = Math.min(...main.filter(x => !x.repeat && x.run == null && pause(x)).map(pause));
  let cur = null;
  main.forEach(st => {
    if (!st.repeat) {
      if (st.run != null) { if (!cur) out.push(cur = { pills: [], rec: "" }); cur.pills.push(repLabel(st)); }
      else if (cur && pause(st) === short && main.some(x => x.run == null && !x.repeat && pause(x) > short)) cur.rec = describe(st);
      else if (cur && pause(st) === short && !main.some(x => x.repeat)) cur.rec = describe(st);
      else { cur = null; out.push({ rest: describe(st) }); }
      return;
    }
    cur = null;
    const inner = st.steps, nested = inner.length === 1 && inner[0].repeat;
    if (nested || runsOf(inner).length > 1) {
      for (let i = 0; i < st.repeat; i++) {
        if (i && st.rest) out.push({ rest: describe(st.rest) });
        out.push(nested ? { pills: Array(inner[0].repeat).fill(runsOf(inner[0].steps).map(repLabel).join(" + ")), rec: recOf(inner[0]) } : { pills: runsOf(inner).map(repLabel), rec: recOf({ steps: inner }) });
      }
    } else out.push({ pills: Array(st.repeat).fill(runsOf(inner).map(repLabel).join(" + ")), rec: recOf(st) });
  });
  return out;
};
const volume = (steps) => (steps || []).reduce((t, st) => t + (st.repeat ? st.repeat * volume(st.steps) : typeof st.run === "number" ? st.run : 0), 0);
let sessLevel = "level2";

const renderSession = () => {
  if (!session) { $("sess").innerHTML = `<p class="kicker">Prochaine séance</p><div class="title">Cycle terminé</div><p>Aucune séance à venir dans le cycle.</p>`; return; }
  const main = mainOf(session, sessLevel), bl = blocksOf(main), rs = reps(main), vol = volume(main);
  let n = 0;
  const flow = bl.map(b => b.rest
    ? `<div class="gap"><span>${esc(b.rest)}</span></div>`
    : `<div class="blk"><div class="bh"><b>Bloc ${++n}</b><span>${b.pills.length} rép.${b.rec ? " · récup " + esc(b.rec) : ""}</span></div><div class="pills">${b.pills.map(p => `<i>${esc(p)}</i>`).join("")}</div></div>`).join("");
  const facts = [
    rs.length ? ["Intensité", [...new Set(rs.map(r => r.vma))].join(" / ") + " % VMA"] : null,
    vol ? ["Volume vite", vol >= 1000 ? String(vol / 1000).replace(".", ",") + " km" : vol + " m"] : null,
    ["Blocs", String(n)],
  ].filter(Boolean);
  const side = (label, steps) => steps && steps.length ? `<div class="step"><b>${label}</b><span>${esc(steps.map(describe).filter(Boolean).join(" + "))}</span></div>` : "";
  $("sess").innerHTML = `<p class="kicker">Prochaine séance · ${esc(frDate(session.date))} · 16h30 · la Floride</p>
    <div class="title">${esc(session.title)}</div>
    <p>${esc(session.summary || "")}</p>
    <div class="lv" role="group" aria-label="Niveau">${LEVELS.filter(l => l.club).map(l => `<button type="button" data-lv="${l.id}" aria-pressed="${l.id === sessLevel}">${l.name}</button>`).join("")}</div>
    <div class="facts">${facts.map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>
    <div class="flow">${side("Échauffement", session.warmup)}${flow}${side("Retour au calme", session.cooldown)}</div>`;
};

const render = () => {
  renderSession();
  const synced = wod && session && wod.session_date === session.date;
  const p = pool();
  const club = p.filter(a => a.level && a.level.club);
  $("stats").innerHTML = [
    [synced ? "Réservés" : "Athlètes club", synced ? p.length + extras.length : club.length, ""],
    ["Groupes d'allure", packs(p).length, ""],
    ["Sans VMA", club.filter(a => !a.vma).length, club.some(a => !a.vma) ? "warn" : ""],
    ["Douleurs", p.filter(a => a.injury).length, p.some(a => a.injury) ? "warn" : ""],
  ].map(([k, v, c]) => `<div class="stat ${c}"><span>${k}</span><b>${v}</b></div>`).join("");

  const n = $("wodNote");
  if (!wod) { n.hidden = false; n.innerHTML = `<b>Réservations Wodify pas encore synchronisées.</b> Les groupes ci-dessous prennent tous les athlètes Level 1–3 ; le nombre de séances vient de l'app.`; }
  else if (!synced) { n.hidden = false; n.innerHTML = `<b>Les réservations Wodify affichées datent d'une autre séance</b> (${esc(wod.session_date || "?")}). Les groupes prennent tous les athlètes Level 1–3 en attendant la prochaine synchro.`; }
  else n.hidden = true;

  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  $("tools").hidden = view === "groups";
  $("chips").innerHTML = [["", "Tous"], ...LEVELS.map(l => [l.id, l.short])].map(([id, t]) => `<button type="button" class="chip" data-level="${id}" aria-pressed="${levelFilter === id}">${t}</button>`).join("");

  const q = norm($("search").value);
  let html = "";
  if (view === "groups") {
    const gs = packs(p);
    html += gs.map((g, i) => { const t = packTarget(g); return `<section class="group"><header><span><span class="g">Groupe ${i + 1}</span><br><span class="muted small">${g.length} coureur${g.length > 1 ? "s" : ""} · VMA ${g[g.length - 1].vma.toFixed(1)}${g.length > 1 ? "–" + g[0].vma.toFixed(1) : ""}</span></span>${t ? `<span class="t"><b>${t.text}</b><span>par ${t.label}</span></span>` : ""}</header><div class="list">${g.map(row).join("")}</div></section>`; }).join("");
    if (!gs.length) html += `<div class="card"><p class="muted">Aucun athlète avec une VMA pour former des groupes.</p></div>`;
    const noVma = club.filter(a => !a.vma).sort(cmp);
    if (noVma.length) html += `<h2>Sans VMA <b>${noVma.length}</b></h2><div class="card flush"><div class="list">${noVma.map(row).join("")}</div></div>`;
    const beg = p.filter(a => !a.level || !a.level.club).sort(cmp);
    if (beg.length) html += `<h2>Débuter / niveau à confirmer <b>${beg.length}</b></h2><div class="card flush"><div class="list">${beg.map(row).join("")}</div></div>`;
    if (extras.length) html += `<h2>Réservés sans fiche <b>${extras.length}</b></h2><div class="card"><p class="muted small">Dans Wodify mais pas de questionnaire à ce nom :</p><p>${extras.map(esc).join(" · ")}</p></div>`;
  } else {
    let list = view === "booked" ? athletes.filter(a => a.booked) : athletes.slice();
    if (levelFilter) list = list.filter(a => a.level && a.level.id === levelFilter);
    if (q) list = list.filter(a => a.key.includes(q));
    list.sort(view === "all" ? (a, b) => a.name.localeCompare(b.name) : cmp);
    html += `<h2>${view === "booked" ? "Réservés pour " + (session ? frDate(session.date) : "la prochaine séance") : "Tous les athlètes"} <b>${list.length}</b></h2>`;
    html += list.length ? `<div class="card flush"><div class="list">${list.map(row).join("")}</div></div>`
      : `<div class="card"><p class="muted">${view === "booked" && !synced ? "Les réservations Wodify ne sont pas encore synchronisées pour cette séance." : "Personne ici."}</p></div>`;
  }
  $("view").innerHTML = html;
  $("stamp").textContent = wod && wod.updated_at ? "Wodify synchronisé le " + new Date(wod.updated_at).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
};

/* The groups as a message for the coaches' WhatsApp */
const asText = () => {
  if (!session) return "";
  const p = pool(), lines = [`${session.title} — ${frDate(session.date)}`, ""];
  LEVELS.filter(l => l.club).forEach(l => { const m = mainOf(session, l.id); if (m.length) lines.push(`${l.name} : ${m.map(describe).join(" + ")}`); });
  packs(p).forEach((g, i) => { const t = packTarget(g); lines.push("", `Groupe ${i + 1}${t ? ` — ${t.text} par ${t.label}` : ""}`); g.forEach(a => lines.push(`• ${a.name} (${a.level.short}, VMA ${a.vma.toFixed(1)})`)); });
  const noVma = p.filter(a => a.level && a.level.club && !a.vma);
  if (noVma.length) lines.push("", "Sans VMA : " + noVma.map(a => a.name).join(", "));
  const beg = p.filter(a => !a.level || !a.level.club);
  if (beg.length) lines.push("", "Débuter : " + beg.map(a => a.name).join(", "));
  return lines.join("\n");
};

/* ── Events ── */
$("enter").onclick = () => { code = $("code").value.trim(); if (code) load(); };
$("code").onkeydown = (e) => { if (e.key === "Enter") $("enter").click(); };
$("refresh").onclick = load;
$("out").onclick = () => { store.set("essor-coach-code", null); code = ""; $("hub").hidden = true; $("gate").hidden = false; $("gateBad").hidden = true; $("code").value = ""; };
$("copy").onclick = async () => { const b = $("copy"); try { await navigator.clipboard.writeText(asText()); b.textContent = "Copié ✓"; } catch { b.textContent = "Copie impossible"; } setTimeout(() => (b.textContent = "Copier pour WhatsApp"), 1800); };
$("search").oninput = render;
$("sess").onclick = (e) => { const b = e.target.closest("[data-lv]"); if (b) { sessLevel = b.dataset.lv; renderSession(); } };
document.querySelector(".seg").onclick = (e) => { const b = e.target.closest("button"); if (b) { view = b.dataset.view; render(); } };
$("chips").onclick = (e) => { const b = e.target.closest("button"); if (b) { levelFilter = b.dataset.level; render(); } };
$("view").onclick = (e) => { const b = e.target.closest(".ath > button"); if (!b) return; const id = b.dataset.id; open.has(id) ? open.delete(id) : open.add(id); render(); };

if (code) load(); else { $("loading").hidden = true; $("gate").hidden = false; }
</script>
</body>
</html>
