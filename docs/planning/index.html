<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Planning coachs · Essor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,900&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #0A0A0A; --fg: #FAFAF8; --card: #161616; --line: #262626; --muted: #9AA7A1;
  --accent-soft: rgba(124,196,162,0.12); --mint: #7CC4A2; --bad: #E07A5F; --bad-soft: rgba(224,122,95,0.14); --warn: #E8B44B;
  --display: 'Archivo', 'Arial Black', Arial, sans-serif; --body: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 17px; line-height: 1.45; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 80px; }
.brand { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 34px; letter-spacing: -1px; line-height: 0.95; }
.brand span { display: block; font-family: var(--body); font-style: normal; font-weight: 500; font-size: 12px; letter-spacing: 3px; color: var(--mint); margin-top: 6px; }
h1 { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 30px; line-height: 1.02; letter-spacing: -0.8px; margin: 22px 0 6px; }
h2 { font-size: 13px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
.muted { color: var(--muted); font-size: 15px; }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; }
.status { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 10px 14px; font-size: 15px; background: var(--accent-soft); color: var(--fg); border: 1px solid rgba(124,196,162,0.35); margin-top: 16px; }
.status.err { background: var(--bad-soft); border-color: rgba(224,122,95,0.4); }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); flex: none; }
.status.err .dot { background: var(--bad); }
.sess { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.sess:first-of-type { border-top: 0; padding-top: 4px; }
.when { min-width: 86px; }
.when b { display: block; font-size: 15px; }
.when span { font-size: 13px; color: var(--muted); }
.what { flex: 1; }
.what b { display: block; font-size: 16px; }
.what span { font-size: 13px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: #222; color: var(--muted); margin-left: 6px; vertical-align: middle; }
.tag.pt { background: #2a2a2a; }
button.tgl { font: inherit; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
button.tgl[aria-pressed="true"] { background: var(--bad-soft); color: var(--bad); border-color: rgba(224,122,95,0.5); }
.sess.off .what b, .sess.off .when b { text-decoration: line-through; color: var(--muted); }
.swap { border-color: rgba(232,180,75,0.45); }
.swap .why { font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
.swap .from { color: var(--warn); font-weight: 500; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { font: inherit; font-size: 15px; border: 0; border-radius: 10px; padding: 10px 8px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button.ok[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 0 0 1px var(--mint); }
.seg button.no[aria-pressed="true"] { background: var(--bad-soft); color: var(--fg); box-shadow: inset 0 0 0 1px var(--bad); }
textarea { width: 100%; font: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; resize: vertical; min-height: 44px; }
.btn { font: inherit; font-size: 17px; font-weight: 500; border: 0; border-radius: 26px; height: 52px; padding: 0 20px; background: var(--mint); color: #0A0A0A; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; text-decoration: none; margin-top: 18px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); margin-top: 10px; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.done { border-color: rgba(124,196,162,0.45); }
.hidden { display: none !important; }
.week-note { font-size: 13px; color: var(--warn); margin: -4px 0 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; border-top: 0; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; }
.pill.ok { background: var(--accent-soft); color: var(--mint); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.wait { background: #222; color: var(--muted); }
.views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-top: 14px; }
.views button { font: inherit; font-size: 15px; border: 0; border-radius: 10px; padding: 9px 8px; background: transparent; color: var(--muted); cursor: pointer; }
.views button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 0 0 1px var(--mint); }
.cal { margin-top: 12px; }
.cal .month { font-size: 15px; font-weight: 600; margin: 14px 0 6px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.grid .dow { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); text-align: center; padding: 2px 0 4px; }
.day { min-height: 74px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
.day.empty { background: transparent; border-color: transparent; }
.day.pad { opacity: 0.45; }
.day .n { font-size: 12px; color: var(--muted); line-height: 1; margin-bottom: 1px; }
.day.today .n { color: var(--mint); font-weight: 600; }
.chip { font: inherit; font-size: 10.5px; line-height: 1.15; font-weight: 500; border: 0; border-radius: 6px; padding: 3px 4px; text-align: left; background: var(--accent-soft); color: var(--fg); cursor: pointer; overflow: hidden; }
.chip small { display: block; font-weight: 400; color: var(--muted); font-size: 9.5px; }
.chip.off { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
.chip.ask { background: rgba(232,180,75,0.18); }
.chip.ask.ok { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--mint); }
.chip.ask.no { background: var(--bad-soft); color: var(--bad); }
.chip.pt { background: #262626; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { width: 100%; max-width: 640px; background: var(--card); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 18px 18px 28px; }
.sheet h3 { font-size: 20px; margin: 0 0 2px; }
.sheet .close { float: right; font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.chip[data-coach] { color: #0A0A0A; }
.chip[data-coach] small { color: rgba(0,0,0,0.65); }
.chip[data-coach].off { text-decoration: line-through; opacity: 0.55; }
.chip[data-coach].mark::after { content: attr(data-mark); float: right; font-size: 9px; font-weight: 700; }
.day.many { min-height: 100px; }

/* ── Coach view, phone first ── */
.wrap { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
.hello { font-size: 17px; color: var(--muted); margin: 0; }
.hello b { color: var(--fg); font-weight: 600; }
.steps { padding: 6px 16px; margin-top: 16px; }
.step { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; text-align: left; cursor: pointer; min-height: 56px; }
.step:first-child { border-top: 0; }
.step .num { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--muted); }
.step.now .num { border-color: var(--mint); color: var(--mint); }
.step.ok .num { background: var(--mint); border-color: var(--mint); color: #0A0A0A; }
.step .txt { flex: 1; }
.step .txt b { display: block; font-size: 16px; font-weight: 600; }
.step .txt span { display: block; font-size: 14px; color: var(--muted); }
.step.ok .txt b { color: var(--muted); }
.step .go { color: var(--muted); font-size: 18px; }
.info { border-color: rgba(232,180,75,0.4); font-size: 15px; display: flex; gap: 10px; }
.info .ic { flex: none; }
.ask h3 { margin: 0; font-size: 19px; }
.ask .meta { color: var(--muted); font-size: 15px; margin: 2px 0 8px; }
.ask .why { font-size: 14.5px; color: var(--muted); margin: 0 0 12px; }
.ask .from { color: var(--warn); font-weight: 500; }
.ask { border-color: rgba(232,180,75,0.45); scroll-margin-top: 16px; }
.ask.yes { border-color: rgba(124,196,162,0.5); }
.ask.nope { border-color: rgba(224,122,95,0.5); }
.seg button { min-height: 50px; font-size: 16px; font-weight: 500; }
.linkbtn { font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: 0; padding: 12px 0 2px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.dayhead { font-size: 13px; color: var(--muted); letter-spacing: 0.4px; padding: 14px 0 2px; border-top: 1px solid var(--line); }
.dayhead:first-of-type { border-top: 0; padding-top: 2px; }
.wkhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.wkhead b { font-size: 16px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 0; min-height: 56px; }
.row .time { min-width: 62px; font-variant-numeric: tabular-nums; }
.row .time b { display: block; font-size: 16px; }
.row .time span { font-size: 13px; color: var(--muted); }
.row .what { flex: 1; font-size: 16px; font-weight: 600; }
.row.off .time b, .row.off .what > b { text-decoration: line-through; color: var(--muted); }
.row .what b { font-weight: 600; }
button.cant { font: inherit; font-size: 14px; font-weight: 500; min-height: 44px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
button.cant[aria-pressed="true"] { background: var(--bad-soft); color: var(--bad); border-color: rgba(224,122,95,0.5); }
.rowstate { font-size: 13px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.rowstate.ok { background: var(--accent-soft); color: var(--mint); }
.rowstate.bad { background: var(--bad-soft); color: var(--bad); }
.rowstate.wait { background: rgba(232,180,75,0.16); color: var(--warn); }
.tag.set { background: var(--accent-soft); color: var(--mint); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(10,10,10,0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 608px; margin: 0 auto; }
.bar .btn { margin-top: 0; height: 54px; font-weight: 600; }
.bar .btn.todo { background: var(--warn); }
.bar .btn.fin { background: transparent; color: var(--mint); border: 1px solid rgba(124,196,162,0.5); }
.bar .saved { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 18px; }
.bar .saved.err { color: var(--bad); }
.grid.six { grid-template-columns: repeat(6, 1fr); }
.grid.six .chip { font-size: 11.5px; padding: 6px 4px; min-height: 40px; }
.grid.six .chip small { font-size: 10.5px; }
.grid.six .day { min-height: 64px; }
@media (max-width: 380px) { body { font-size: 16px; } h1 { font-size: 27px; } .row .time { min-width: 56px; } button.cant { padding: 0 11px; } }
.views.months { margin-top: 8px; }
.views.months button { font-weight: 600; }
.card.ro { opacity: 0.8; }
.card.ro .row { min-height: 44px; padding: 4px 0; }
.chip.ro { background: #1d1d1d; color: var(--muted); cursor: default; }
footer { margin-top: 36px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">essor<span>PLANNING COACHS</span></div>
  <div id="app"><p class="muted" style="margin-top:24px">Chargement…</p></div>
  <footer>Ton lien reste le même chaque mois. Les échanges passent toujours par Sean, pour que le planning et Wodify restent alignés. Une question : réponds au mail ou envoie un SMS.</footer>
</div>
<script>
/* Current month lives in data.js; older months in data-YYYY-MM.js, opened with &m=YYYY-MM. */
(function () { var m = new URLSearchParams(location.search).get("m"); document.write('<script src="' + (/^\d{4}-\d{2}$/.test(m || "") ? "data-" + m + ".js" : "data.js") + '"><\/script>'); })();
</script>
<script src="months.js"></script>
<script>
/* ── Supabase (same project as the run club). Data goes through the planning_* functions in supabase/planning.sql. ── */
const SUPABASE_URL = "https://rqomypmgbjigukvztjxz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LnDYfyrKMTOunfAH29ZFTQ_CY3GtJE5";
async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  });
  if (!r.ok) { const t = await r.text(); throw new Error(t.slice(0, 200) || r.status); }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}

let P = window.PLANNING;
const MONTHS = window.PLANNING_MONTHS || [{ m: P.month, label: P.label, file: "data.js" }];
const q = new URLSearchParams(location.search);
const coach = (q.get("c") || "").toLowerCase();
const code = q.get("k") || "";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAYS = { Lundi: "lun.", Mardi: "mar.", Mercredi: "mer.", Jeudi: "jeu.", Vendredi: "ven.", Samedi: "sam." };
const fmtDate = iso => { const d = new Date(iso + "T12:00:00"); return `${d.getDate().toString().padStart(2, "0")}/${(d.getMonth() + 1).toString().padStart(2, "0")}`; };
const weekLabel = (wk, sessions) => {
  const ds = sessions.filter(s => s.wk === wk).map(s => s.date).sort();
  if (!ds.length) return `Semaine ${wk}`;
  return `Semaine ${wk} · ${fmtDate(ds[0])} → ${fmtDate(ds[ds.length - 1])}`;
};

let answers = {};   // session_key -> {answer, comment}
let view = (() => { try { return localStorage.getItem('planning_view') || 'list'; } catch (e) { return 'list'; } })();
let openKey = null;
let saving = 0;

function setSaved(text, err) {
  const el = document.getElementById("saved"); if (!el) return;
  el.className = "saved" + (err ? " err" : ""); el.textContent = text;
}

async function save(key, answer, comment) {
  answers[key] = { answer, comment: comment ?? answers[key]?.comment ?? "" };
  saving++; setSaved("Enregistrement…");
  try {
    await rpc("planning_answer", { p_coach: coach, p_code: code, p_month: P.month, p_session: key, p_answer: answer, p_comment: answers[key].comment || null });
    saving--; if (!saving) setSaved("Enregistré ✓");
    return true;
  } catch (e) {
    saving--; setSaved("Pas enregistré — vérifie ta connexion et réessaie.", true); console.error(e);
    return false;
  }
}

/* Any change after confirming puts the planning back to "à confirmer". */
function touch() {
  if (answers._confirmed?.answer === "confirmed") save("_confirmed", null, "");
}

const LONGDAY = iso => { const d = new Date(iso + "T12:00:00"); const M = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."]; return `${d.getDate()} ${M[d.getMonth()]}`; };
const mondayOf = iso => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const nice = n => n[0] + n.slice(1).toLowerCase();
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;
let openNotes = {};   // session_key -> true when the comment box is open

function commentBox(key, attr) {
  const has = !!answers[key]?.comment;
  if (!has && !openNotes[key]) return `<button class="linkbtn" data-note="${esc(key)}">Ajouter un mot pour Sean</button>`;
  return `<textarea placeholder="Un mot pour Sean (facultatif)" ${attr}="${esc(key)}">${esc(answers[key]?.comment || "")}</textarea>`;
}

function renderCoach() {
  const me = P.coaches[coach];
  const swaps = me.sessions.filter(s => me.swaps.includes(s.key));
  const left = swaps.filter(s => !answers[s.key]?.answer);
  const weeks = [...new Set(me.sessions.map(s => s.wk))].sort((a, b) => a - b);
  const hours = me.sessions.reduce((t, s) => { const [h1, m1] = s.s.split(":").map(Number), [h2, m2] = s.e.split(":").map(Number); return t + (h2 * 60 + m2 - h1 * 60 - m1) / 60; }, 0);
  const indispo = me.sessions.filter(s => !me.swaps.includes(s.key) && answers[s.key]?.answer === "indispo").length;
  const confirmed = answers._confirmed?.answer === "confirmed";

  let html = `<h1>${esc(P.label)}</h1>
  <p class="hello"><b>Salut ${esc(me.name)}.</b> ${plural(me.sessions.length, "séance")} · ${String(hours).replace(".", ",")} h ce mois-ci. Trois choses à faire, ça prend deux minutes.</p>
  <div class="card steps">`;
  if (swaps.length) html += `<button class="step ${left.length ? "now" : "ok"}" data-goto="${left.length ? esc(left[0].key) : "asks"}"><span class="num">${left.length ? "1" : "✓"}</span><span class="txt"><b>Réponds aux demandes</b><span>${left.length ? `${swaps.length - left.length} sur ${swaps.length} répondue${swaps.length - left.length > 1 ? "s" : ""}` : `${plural(swaps.length, "réponse")} enregistrée${swaps.length > 1 ? "s" : ""}`}</span></span><span class="go">›</span></button>`;
  const n2 = swaps.length ? 2 : 1, n3 = n2 + 1;
  html += `<button class="step ${confirmed ? "ok" : !left.length ? "now" : ""}" data-goto="plan"><span class="num">${confirmed ? "✓" : n2}</span><span class="txt"><b>Vérifie tes séances</b><span>${indispo ? `${plural(indispo, "indispo")} signalée${indispo > 1 ? "s" : ""}` : "Une séance impossible ? Appuie sur « Je ne peux pas »"}</span></span><span class="go">›</span></button>
    <button class="step ${confirmed ? "ok" : !left.length ? "now" : ""}" data-goto="bar"><span class="num">${confirmed ? "✓" : n3}</span><span class="txt"><b>Confirme</b><span>${confirmed ? "C'est fait, merci" : "Le bouton vert en bas de l'écran"}</span></span><span class="go">›</span></button>
  </div>`;
  if (P.banner) html += `<div class="card info"><span class="ic">🎄</span><span>${esc(P.banner)}</span></div>`;
  html += `<div class="views"><button data-view="list" aria-pressed="${view === "list"}">Liste</button><button data-view="cal" aria-pressed="${view === "cal"}">Calendrier</button></div>`;

  if (view === "cal") { html += renderCalendar(me); }
  if (view === "list" && swaps.length) {
    html += `<h2 id="asks">On te demande · ${swaps.length}</h2>`;
    if (left.length >= 3) html += `<button class="btn ghost" id="allok" style="margin:0 0 10px">OK pour ${left.length === swaps.length ? "tout" : `les ${left.length} qui restent`}</button>`;
    for (const s of swaps) {
      const a = answers[s.key]?.answer;
      html += `<div class="card ask${a === "ok" ? " yes" : a === "pas_possible" ? " nope" : ""}" id="ask-${esc(s.key)}" data-key="${esc(s.key)}">
        <h3>${esc(s.cl)}</h3>
        <div class="meta">${esc(s.day)} ${LONGDAY(s.date)} · ${esc(s.s)}–${esc(s.e)}</div>
        <p class="why">${s.from ? `<span class="from">À la place de ${esc(nice(s.from))}.</span> ` : ""}${esc(s.why)}</p>
        <div class="seg">
          <button class="ok" aria-pressed="${a === "ok"}" data-ans="ok">${a === "ok" ? "✓ " : ""}OK, je prends</button>
          <button class="no" aria-pressed="${a === "pas_possible"}" data-ans="pas_possible">${a === "pas_possible" ? "✕ " : ""}Pas possible</button>
        </div>
        ${commentBox(s.key, "data-comment")}
      </div>`;
    }
  }

  if (view === "list") {
    html += `<h2 id="plan">Tes séances</h2>`;
    if (me.before && me.before.length) {
      html += `<div class="card ro"><div class="wkhead"><b>Semaine du ${LONGDAY(mondayOf(me.before[0].date))}</b><span class="rowstate ok">Déjà confirmée</span></div><div class="muted small" style="margin:-2px 0 4px">${esc(P.beforeNote || "")}</div>`;
      let lastB = null;
      for (const s of me.before) {
        if (s.date !== lastB) { html += `<div class="dayhead">${esc(s.day)} ${LONGDAY(s.date)}</div>`; lastB = s.date; }
        html += `<div class="row"><div class="time"><b>${esc(s.s)}</b><span>${esc(s.e)}</span></div><div class="what"><b>${esc(s.cl)}</b>${s.typ === "1:1" ? `<span class="tag pt">1:1</span>` : ""}</div></div>`;
      }
      html += `</div>`;
    }
    for (const wk of weeks) {
      const list = me.sessions.filter(s => s.wk === wk);
      const ds = list.map(s => s.date).sort();
      html += `<div class="card"><div class="wkhead"><b>Semaine du ${LONGDAY(mondayOf(ds[0]))}</b><span class="muted small">${plural(list.length, "séance")}</span></div>`;
      let lastDate = null;
      for (const s of list) {
        if (s.date !== lastDate) {
          html += `<div class="dayhead">${esc(s.day)} ${LONGDAY(s.date)}${P.notes[s.date] ? ` · <span style="color:var(--warn)">${esc(P.notes[s.date])}</span>` : ""}</div>`;
          lastDate = s.date;
        }
        const isSwap = me.swaps.includes(s.key);
        const a = answers[s.key]?.answer;
        const off = !isSwap && a === "indispo";
        let right;
        if (isSwap) right = a === "ok" ? `<span class="rowstate ok">OK ✓</span>` : a === "pas_possible" ? `<span class="rowstate bad">Pas possible</span>` : `<button class="rowstate wait" data-goto="${esc(s.key)}" style="border:0;font:inherit;font-size:13px;min-height:44px;cursor:pointer">À répondre ↑</button>`;
        else right = `<button class="cant" aria-pressed="${off}" data-indispo="${esc(s.key)}">${off ? "Indispo · annuler" : "Je ne peux pas"}</button>`;
        html += `<div class="row${off || (isSwap && a === "pas_possible") ? " off" : ""}" data-key="${esc(s.key)}">
          <div class="time"><b>${esc(s.s)}</b><span>${esc(s.e)}</span></div>
          <div class="what"><b>${esc(s.cl)}</b>${s.typ === "1:1" ? `<span class="tag pt">1:1</span>` : ""}${s.tag ? `<span class="tag set">${esc(s.tag)}</span>` : ""}</div>
          ${right}
        </div>`;
        if (off) html += commentBox(s.key, "data-comment");
      }
      html += `</div>`;
    }
  }

  if (me.file) html += `<a class="btn ghost" id="dl" href="files/${esc(me.file)}" download>Télécharger mon planning avec mes réponses (Excel)</a>`;
  const barBtn = left.length
    ? `<button class="btn todo" id="next">${left.length === 1 ? "Il reste 1 demande à répondre" : `Il reste ${left.length} demandes à répondre`} ↑</button>`
    : confirmed ? `<button class="btn fin" disabled>Planning confirmé ✓ — merci</button>`
    : `<button class="btn" id="confirm">Tout est bon, je confirme</button>`;
  html += `<div class="bar" id="bar"><div class="in">${barBtn}<div class="saved" id="saved">${confirmed ? "Tu peux encore modifier : il suffira de reconfirmer." : "Chaque réponse est enregistrée tout de suite."}</div></div></div>`;
  if (openKey) html += renderSheet(me, openKey);
  app.innerHTML = html;

  const goto = k => {
    if (k === "bar") { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); return; }
    if (view !== "list") { view = "list"; renderCoach(); }
    const el = document.getElementById(k) || document.getElementById("ask-" + k);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  app.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => goto(b.dataset.goto)));
  const nx = document.getElementById("next"); if (nx) nx.addEventListener("click", () => goto(left[0].key));
  app.querySelectorAll("[data-note]").forEach(b => b.addEventListener("click", () => {
    openNotes[b.dataset.note] = true; renderCoach();
    const t = app.querySelector(`textarea[data-comment="${CSS.escape(b.dataset.note)}"]`); if (t) t.focus();
  }));
  const allok = document.getElementById("allok");
  if (allok) allok.addEventListener("click", () => { touch(); for (const s of left) save(s.key, "ok"); renderCoach(); });

  app.querySelectorAll(".views button[data-view]").forEach(b => b.addEventListener("click", () => {
    view = b.dataset.view; try { localStorage.setItem("planning_view", view); } catch (e) {} renderCoach();
  }));
  app.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { openKey = b.dataset.key; renderCoach(); }));
  const bg = app.querySelector(".sheet-bg");
  if (bg) {
    bg.addEventListener("click", e => { if (e.target === bg || e.target.classList.contains("close")) { openKey = null; renderCoach(); } });
    bg.querySelectorAll("[data-sheet-indispo]").forEach(b => b.addEventListener("click", () => {
      const key = b.dataset.sheetIndispo; const now = answers[key]?.answer === "indispo";
      touch(); save(key, now ? null : "indispo"); openKey = null; renderCoach();
    }));
    bg.querySelectorAll(".sheet .seg button").forEach(b => b.addEventListener("click", () => {
      touch(); save(b.dataset.key, b.dataset.ans); openKey = null; renderCoach();
    }));
    bg.querySelectorAll("textarea[data-sheet-comment]").forEach(t => t.addEventListener("change", () => {
      const key = t.dataset.sheetComment; save(key, answers[key]?.answer ?? null, t.value.trim());
    }));
  }

  app.querySelectorAll("[data-indispo]").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.indispo; const now = answers[key]?.answer === "indispo";
    touch(); save(key, now ? null : "indispo"); renderCoach();
  }));
  app.querySelectorAll(".ask .seg button").forEach(b => b.addEventListener("click", () => {
    const key = b.closest(".ask").dataset.key;
    const same = answers[key]?.answer === b.dataset.ans;
    touch(); save(key, same ? null : b.dataset.ans);
    if (!same && b.dataset.ans === "pas_possible") openNotes[key] = true;
    renderCoach();
  }));
  app.querySelectorAll("textarea[data-comment]").forEach(t => t.addEventListener("change", () => {
    const key = t.dataset.comment; save(key, answers[key]?.answer ?? null, t.value.trim());
  }));
  const dl = document.getElementById("dl");
  if (dl) dl.addEventListener("click", async e => {
    e.preventDefault(); const label = dl.textContent; dl.textContent = "Préparation du fichier…";
    try { await downloadFilled(me); } catch (err) { console.error(err); location.href = dl.href; }
    dl.textContent = label;
  });
  const c = document.getElementById("confirm");
  if (c) c.addEventListener("click", async () => {
    c.disabled = true; c.textContent = "Envoi…";
    const ok = await save("_confirmed", "confirmed", "");
    if (!ok) answers._confirmed = { answer: null };
    renderCoach();
    if (!ok) setSaved("Pas envoyé — vérifie ta connexion et réessaie.", true);
  });
}

/* The Excel download is the coach's own file with their answers written in:
   « Oui » under Indisponible ?, OK / Pas possible under Ta réponse. Built in the browser (ExcelJS). */
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
}
async function downloadFilled(me) {
  if (!window.ExcelJS) await loadScript("exceljs.min.js");
  const buf = await (await fetch("files/" + me.file)).arrayBuffer();
  const wb = new ExcelJS.Workbook(); await wb.xlsx.load(buf);
  const frDate = iso => iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4);
  const byRow = {}; for (const s of me.sessions) byRow[frDate(s.date) + " " + s.s] = s;
  const mine = wb.worksheets[0]; let last = 4;
  mine.eachRow((row, n) => {
    if (n < 5) return; const s = byRow[row.getCell(2).value + " " + row.getCell(4).value]; if (!s) return;
    last = n; const a = answers[s.key]?.answer;
    row.getCell(8).value = a === "indispo" || a === "pas_possible" ? "Oui" : a === "ok" || answers._confirmed?.answer === "confirmed" ? "Non" : null;
  });
  const ex = wb.worksheets[2];
  if (ex) ex.eachRow((row, n) => {
    if (n < 5) return; const s = byRow[row.getCell(2).value + " " + row.getCell(4).value]; if (!s) return;
    const a = answers[s.key]?.answer; row.getCell(10).value = a === "ok" ? "OK" : a === "pas_possible" ? "Pas possible" : null;
  });
  const now = new Date(); const stamp = now.toLocaleDateString("fr-FR") + " à " + now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  mine.getCell(last + 5, 1).value = `Réponses au ${stamp} — ${answers._confirmed?.answer === "confirmed" ? "planning confirmé" : "pas encore confirmé"}.`;
  const out = await wb.xlsx.writeBuffer();
  const url = URL.createObjectURL(new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = document.createElement("a"); a.href = url; a.download = me.file; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function renderCalendar(me) {
  const byDate = {};
  for (const s of (me.before || [])) (byDate[s.date] ||= []).push({ ...s, ro: true });
  for (const s of me.sessions) (byDate[s.date] ||= []).push(s);
  const dates = me.sessions.map(s => s.date).sort();
  const first = new Date(dates[0] + "T12:00:00"), last = new Date(dates[dates.length - 1] + "T12:00:00");
  const months = []; let m = new Date(first.getFullYear(), first.getMonth(), 1);
  while (m <= last) { months.push(new Date(m)); m = new Date(m.getFullYear(), m.getMonth() + 1, 1); }
  const today = new Date().toISOString().slice(0, 10);
  const MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  let html = `<div class="cal"><p class="muted small" style="margin:12px 0 0">Appuie sur une séance pour répondre ou dire que tu ne peux pas.</p>`;
  for (const mo of months) {
    html += `<div class="month">${MONTHS[mo.getMonth()]} ${mo.getFullYear()}</div><div class="grid six">`;
    for (const d of ["L", "M", "M", "J", "V", "S"]) html += `<div class="dow">${d}</div>`;
    const startPad = Math.min((mo.getDay() + 6) % 7, 6) % 6;
    for (let i = 0; i < startPad; i++) html += `<div class="day empty"></div>`;
    const days = new Date(mo.getFullYear(), mo.getMonth() + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const iso = `${mo.getFullYear()}-${String(mo.getMonth() + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      if (iso > dates[dates.length - 1] && new Date(iso + "T12:00:00").getDay() === 1) break;   // stop after the last week that has classes
      if (new Date(iso + "T12:00:00").getDay() === 0) continue;
      const list = byDate[iso] || [];
      const inRange = (iso >= dates[0] && iso <= dates[dates.length - 1]) || list.length > 0;
      html += `<div class="day${inRange ? "" : " pad"}${iso === today ? " today" : ""}"><div class="n">${d}</div>`;
      for (const s of list) {
        if (s.ro) { html += `<div class="chip ro">${esc(s.cl)}<small>${esc(s.s)}</small></div>`; continue; }
        const a = answers[s.key]?.answer; const isSwap = me.swaps.includes(s.key);
        const cls = ["chip", s.typ === "1:1" ? "pt" : "", isSwap ? "ask" : "", isSwap && a === "ok" ? "ok" : "", isSwap && a === "pas_possible" ? "no" : "", !isSwap && a === "indispo" ? "off" : ""].filter(Boolean).join(" ");
        html += `<button class="${cls}" data-key="${esc(s.key)}">${esc(s.cl.replace("1:1 ", ""))}<small>${esc(s.s)}</small></button>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `<div class="legend"><span><i style="background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--mint)"></i>Tes séances</span><span><i style="background:rgba(232,180,75,0.5)"></i>Demande à répondre</span><span><i style="background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)"></i>Indispo / pas possible</span><span><i style="background:#333"></i>1:1</span></div></div>`;
  return html;
}

function renderSheet(me, key) {
  const s = me.sessions.find(x => x.key === key); if (!s) return "";
  const isSwap = me.swaps.includes(key); const a = answers[key]?.answer;
  let inner = `<button class="close">Fermer ✕</button><h3>${esc(s.cl)}</h3><p class="muted" style="margin:0 0 12px">${esc(s.day)} ${fmtDate(s.date)} · ${esc(s.s)}–${esc(s.e)}${P.notes[s.date] ? `<br><span class="week-note">${esc(P.notes[s.date])}</span>` : ""}</p>`;
  if (isSwap) {
    inner += `<div class="why">${s.from ? `<span class="from">À la place de ${esc(nice(s.from))}.</span> ` : ""}${esc(s.why)}</div>
      <div class="seg"><button class="ok" data-key="${esc(key)}" data-ans="ok" aria-pressed="${a === "ok"}">OK, je prends</button><button class="no" data-key="${esc(key)}" data-ans="pas_possible" aria-pressed="${a === "pas_possible"}">Pas possible</button></div>
      <textarea placeholder="Un mot si besoin (facultatif)" data-sheet-comment="${esc(key)}">${esc(answers[key]?.comment || "")}</textarea>`;
  } else {
    inner += `<button class="btn ${a === "indispo" ? "ghost" : ""}" style="margin-top:4px;${a === "indispo" ? "" : "background:var(--bad);color:#fff"}" data-sheet-indispo="${esc(key)}">${a === "indispo" ? "Finalement je peux la faire" : "Je ne peux pas assurer cette séance"}</button>
      <textarea placeholder="Un mot si besoin (facultatif)" data-sheet-comment="${esc(key)}">${esc(answers[key]?.comment || "")}</textarea>`;
  }
  return `<div class="sheet-bg"><div class="sheet swap" data-key="${esc(key)}">${inner}</div></div>`;
}

function renderAdmin(rows) {
  const by = {};
  for (const r of rows) (by[r.coach] ||= {})[r.session_key] = r;
  let html = `<h1>${esc(P.label)} — vue Sean</h1><p class="muted">Réponses des coachs. Un tap chez eux = une ligne ici, en direct.</p>
  <div class="views"><button data-view="list" aria-pressed="${view === "list"}">Réponses</button><button data-view="cal" aria-pressed="${view === "cal"}">Calendrier</button></div>${monthPills()}`;
  if (view === "cal") { html += renderAdminCalendar(by); html += `<button class="btn ghost" onclick="location.reload()">Actualiser</button>`; app.innerHTML = html; wireViews(renderAdmin, rows); return; }
  for (const [id, me] of Object.entries(P.coaches)) {
    const a = by[id] || {};
    const confirmed = a._confirmed?.answer === "confirmed";
    const indispo = me.sessions.filter(s => a[s.key]?.answer === "indispo");
    const swapRows = me.sessions.filter(s => me.swaps.includes(s.key));
    const answeredSwaps = swapRows.filter(s => a[s.key]?.answer);
    const touched = Object.keys(a).length > 0;
    html += `<div class="card ${confirmed ? "done" : ""}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <b>${esc(me.name)}</b>
        <span class="pill ${confirmed ? "ok" : touched ? "wait" : "wait"}">${confirmed ? "Confirmé ✓" : touched ? "En cours" : "Pas encore ouvert"}</span>
      </div>
      <div class="small muted" style="margin:4px 0 8px">${me.sessions.length} séances · ${indispo.length} indispo · ${answeredSwaps.length}/${swapRows.length} demandes répondues</div>`;
    if (indispo.length || swapRows.length) {
      html += `<table><tr><th>Séance</th><th>Réponse</th><th>Commentaire</th></tr>`;
      for (const s of swapRows) {
        const r = a[s.key]; const ans = r?.answer;
        html += `<tr><td>${DAYS[s.day]} ${fmtDate(s.date)} ${esc(s.s)} ${esc(s.cl)}<br><span class="muted small">demande</span></td>
          <td>${ans === "ok" ? `<span class="pill ok">OK</span>` : ans === "pas_possible" ? `<span class="pill bad">Pas possible</span>` : `<span class="pill wait">—</span>`}</td>
          <td class="small">${esc(r?.comment || "")}</td></tr>`;
      }
      for (const s of indispo) {
        html += `<tr><td>${DAYS[s.day]} ${fmtDate(s.date)} ${esc(s.s)} ${esc(s.cl)}</td><td><span class="pill bad">Indispo</span></td><td class="small">${esc(a[s.key]?.comment || "")}</td></tr>`;
      }
      html += `</table>`;
    }
    html += `</div>`;
  }
  html += `<button class="btn ghost" onclick="location.reload()">Actualiser</button>`;
  app.innerHTML = html;
  wireViews(renderAdmin, rows);
}

/* Sean's view: pick the month. Each month is its own data file, listed in months.js. */
function monthPills() {
  if (MONTHS.length < 2) return "";
  return `<div class="views months" style="grid-template-columns:repeat(${MONTHS.length},1fr)">` + MONTHS.map(x => `<button data-month="${esc(x.m)}" aria-pressed="${x.m === P.month}">${esc(x.label)}</button>`).join("") + `</div>`;
}
async function setMonth(m) {
  const x = MONTHS.find(y => y.m === m); if (!x || m === P.month) return;
  if (window.PLANNING_ALL && window.PLANNING_ALL[m]) P = window.PLANNING_ALL[m];
  else { await loadScript(x.file); P = window.PLANNING; }
  app.innerHTML = `<p class="muted" style="margin-top:24px">Chargement…</p>`;
  renderAdmin(await rpc("planning_all", { p_code: code, p_month: P.month }));
  window.scrollTo(0, 0);
}

function wireViews(fn, arg) {
  app.querySelectorAll("[data-month]").forEach(b => b.addEventListener("click", () => setMonth(b.dataset.month).catch(e => { console.error(e); app.innerHTML = `<h1>Mois indisponible</h1><p class="muted">Impossible de charger ce mois. Actualise la page.</p>`; })));
  app.querySelectorAll(".views button[data-view]").forEach(b => b.addEventListener("click", () => {
    view = b.dataset.view; try { localStorage.setItem("planning_view", view); } catch (e) {} fn(arg);
  }));
}

const COACH_COLORS = { TEO: "#E8A44B", SEAN: "#5BB8E8", INES: "#CC66CC", LILOU: "#92C36E", THOMAS: "#C9B94A", JOFFREY: "#A6A6A6", MEL: "#7FD1C2", ARTHUR: "#C9B3E6", ROMAIN: "#E8A44B", "NEEDS COVER": "#FF4D4D" };
const SHORT = { TEO: "Teo", SEAN: "Sean", INES: "Inès", LILOU: "Lilou", THOMAS: "Thomas", JOFFREY: "Joffrey", MEL: "Mel", ARTHUR: "Arthur", "NEEDS COVER": "À couvrir" };

function renderAdminCalendar(by) {
  // answers keyed by coach id -> session_key
  const idOf = c => c.toLowerCase().replace("è", "e");
  const byDate = {};
  for (const s of P.all) (byDate[s.date] ||= []).push(s);
  const dates = P.all.map(s => s.date).sort();
  const first = new Date(dates[0] + "T12:00:00"), last = new Date(dates[dates.length - 1] + "T12:00:00");
  const months = []; let m = new Date(first.getFullYear(), first.getMonth(), 1);
  while (m <= last) { months.push(new Date(m)); m = new Date(m.getFullYear(), m.getMonth() + 1, 1); }
  const today = new Date().toISOString().slice(0, 10);
  const MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  let html = `<div class="cal"><p class="muted small" style="margin:12px 0 0">Toutes les séances de la salle, couleur = coach. Barré = le coach a dit indispo ou pas possible · ✓ = demande acceptée · ? = demande sans réponse.</p>`;
  for (const mo of months) {
    html += `<div class="month">${MONTHS[mo.getMonth()]} ${mo.getFullYear()}</div><div class="grid">`;
    for (const d of ["L", "M", "M", "J", "V", "S", "D"]) html += `<div class="dow">${d}</div>`;
    const startPad = (mo.getDay() + 6) % 7;
    for (let i = 0; i < startPad; i++) html += `<div class="day empty"></div>`;
    const days = new Date(mo.getFullYear(), mo.getMonth() + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const iso = `${mo.getFullYear()}-${String(mo.getMonth() + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      if (iso > dates[dates.length - 1] && new Date(iso + "T12:00:00").getDay() === 1) break;   // stop after the last week that has classes
      const inRange = iso >= dates[0] && iso <= dates[dates.length - 1];
      const list = byDate[iso] || [];
      html += `<div class="day${inRange ? "" : " pad"}${iso === today ? " today" : ""}${list.length > 5 ? " many" : ""}"><div class="n">${d}</div>`;
      for (const s of list) {
        const cid = idOf(s.coach); const key = `${s.date}_${s.s.replace(":", "")}_${s.cl.replace(/ /g, "-")}`;
        const a = (by[cid] || {})[key]?.answer; const isSwap = (P.coaches[cid]?.swaps || []).includes(key);
        let cls = "chip", mark = "";
        if (a === "indispo" || a === "pas_possible") cls += " off";
        else if (isSwap && a === "ok") { cls += " mark"; mark = "✓"; }
        else if (isSwap) { cls += " mark"; mark = "?"; }
        html += `<div class="${cls}" data-coach="${esc(s.coach)}" data-mark="${mark}" style="background:${COACH_COLORS[s.coach] || "#888"}" title="${esc(s.cl)} ${esc(s.s)} — ${esc(SHORT[s.coach] || s.coach)}">${esc(s.cl)}<small>${esc(s.s)} · ${esc(SHORT[s.coach] || s.coach)}</small></div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `<div class="legend">` + Object.entries(COACH_COLORS).filter(([c]) => c !== "ROMAIN").map(([c, col]) => `<span><i style="background:${col}"></i>${esc(SHORT[c] || c)}</span>`).join("") + `</div></div>`;
  return html;
}

(async () => {
  if (!coach || !code) {
    // Arriving from the site without a personal link: reopen the last planning used on this device, or ask once.
    let saved = null; try { saved = JSON.parse(localStorage.getItem("planning_me") || "null"); } catch (e) {}
    if (saved && saved.c && saved.k && !q.get("login")) { location.replace(`?c=${encodeURIComponent(saved.c)}&k=${encodeURIComponent(saved.k)}`); return; }
    const names = [["sean", "Sean"], ...Object.entries(P.coaches).map(([id, c]) => [id, c.name])];
    app.innerHTML = `<h1>Espace coachs</h1><p class="muted">Choisis ton prénom et entre ton code (celui de ton lien). Ce téléphone s'en souviendra.</p>
      <form id="login" class="card" style="margin-top:16px">
        <label class="small muted" for="lc">Prénom</label>
        <select id="lc" style="width:100%;font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 14px">${names.map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join("")}</select>
        <label class="small muted" for="lk">Code</label>
        <input id="lk" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required style="width:100%;font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:6px">
        <button class="btn" type="submit">Ouvrir mon planning</button>
      </form>`;
    document.getElementById("login").addEventListener("submit", e => {
      e.preventDefault(); const k = document.getElementById("lk").value.trim(); if (!k) return;
      location.href = `?c=${encodeURIComponent(document.getElementById("lc").value)}&k=${encodeURIComponent(k)}`;
    });
    return;
  }
  const remember = () => { try { localStorage.setItem("planning_me", JSON.stringify({ c: coach, k: code })); } catch (e) {} };
  try {
    if (coach === "sean") { const all = await rpc("planning_all", { p_code: code, p_month: P.month }); remember(); renderAdmin(all); return; }
    if (!P.coaches[coach]) throw new Error("unknown coach");
    const rows = await rpc("planning_mine", { p_coach: coach, p_code: code, p_month: P.month });
    for (const r of rows) answers[r.session_key] = { answer: r.answer, comment: r.comment || "" };
    remember(); renderCoach();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<h1>Lien non reconnu</h1><p class="muted">Ce lien ne marche pas (ou la connexion a échoué). Demande à Sean de te le renvoyer.</p><a class="btn ghost" href="?login=1">Entrer mon code</a>`;
    try { localStorage.removeItem("planning_me"); } catch (e2) {}
  }
})();
</script>
</body>
</html>
